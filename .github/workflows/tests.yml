name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql://flask:flask@localhost:5432/flask
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flask
          POSTGRES_PASSWORD: flask
          POSTGRES_DB: flask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flask -d flask"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ['3.14', '3.12', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app.py routes/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app.py routes/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest tests.py -v --tb=short --cov=. --cov-report=term-missing
      continue-on-error: false

    - name: Generate coverage report
      run: |
        pytest tests.py --cov=. --cov-report=xml --cov-report=html
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
